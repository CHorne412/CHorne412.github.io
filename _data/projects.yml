- name: Mad Bracket
  description: >-
    A March Madness bracket app built by a four-person team. I designed the
    MySQL schema — conferences, teams, season stats, coaches, saved brackets —
    and wrote the Flask REST API over it, including the three-table JOIN that
    returns a team's record and conference in one request.
  tech: [Python, Flask, MySQL, SQL]
  note: >-
    Team project in a teammate's repository. My work: the schema and the
    Python/Flask backend; the TypeScript frontend was my teammates'.
  repo: https://github.com/kennethsteuart/CS440-MadBracket
  url: https://github.com/kennethsteuart/CS440-MadBracket
  year: 2026
  featured: true

- name: Optical RPM Measurement System
  description: >-
    An Arduino system that measures motor speed with a TCRT5000 reflective
    optical sensor. Each pass of a reflective marker is counted as a single
    pulse — held by a state flag so one marker crossing the beam doesn't
    register hundreds of times while it's in view — and pulses per sampling
    window convert to live RPM over the serial console. I calibrated the analog
    threshold that separates reflective from non-reflective surfaces, and
    validated readings against a stroboscope up to 5,000 RPM.
  tech: [Arduino, C++, Embedded, Sensors]
  note: >-
    Course project. The sketch is a single file — happy to share it on request.
  year: 2026
  featured: true

- name: Multitasking Operating System
  description: >-
    A multitasking kernel for 32-bit x86, written in C by a team of four. I
    worked on the process control blocks and priority-ordered scheduling
    queues, the command handler and serial driver, and a first-fit heap
    allocator that splits and coalesces blocks.
  tech: [C, x86, Systems]
  note: >-
    Coursework in a private university repository, so the source isn't mine to
    publish — the write-up covers the design.
  year: 2025
  featured: true

- name: Tackle App — Fishing Conditions Web App
  description: >-
    A React app for anglers, built by a six-person team for a software
    engineering course. I built the weather feature: a component that fetches
    an OpenWeather forecast, reshapes the raw payload into per-day summaries —
    temperature, wind, humidity, sunrise and sunset — and renders an
    interactive day picker that opens a detail panel for the day you select.
  tech: [JavaScript, React, Hooks, REST APIs]
  note: >-
    Team project in a course organisation's repository. My contribution was the
    weather conditions feature.
  repo: https://github.com/WVU-CS330-2024-08-Group10/tackle-app
  url: https://github.com/WVU-CS330-2024-08-Group10/tackle-app
  year: 2024
  featured: false

# Your portfolio. Add an entry, a card appears on /projects/ — and on the
# homepage too when `featured: true`.
#
# `repo:` and `demo:` are omitted below because none of this code is on GitHub
# yet. Push a project, add the line, and a "Code →" link appears on its card.
# Recruiters click those, so it's the highest-value thing you can do next.

- name: Mad Bracket
  description: >-
    A March Madness bracket app built by a four-person team. I designed the
    MySQL schema — conferences, teams, season stats, coaches, saved brackets —
    and wrote the Flask REST API over it, including the three-table JOIN that
    returns a team's record and conference in one request.
  tech: [Python, Flask, MySQL, SQL]
  note: >-
    Team project in a teammate's repository. My work: the schema and the
    Python/Flask backend; the TypeScript frontend was my teammates'.
  repo: https://github.com/kennethsteuart/CS440-MadBracket
  url: https://github.com/kennethsteuart/CS440-MadBracket
  year: 2026
  featured: true

- name: Custom Transformer-Based Language Model
  description: >-
    A transformer language model built from the ground up in Python —
    tokenization, training pipeline, and inference — plus a front end that
    lets you prompt the model and get responses in real time.
  tech: [Python, NLP, Transformers, Google Colab]
  year: 2025
  featured: true

- name: Multitasking Operating System
  description: >-
    A multitasking kernel for 32-bit x86, written in C by a team of four. I
    worked on the process control blocks and priority-ordered scheduling
    queues, the command handler and serial driver, and a first-fit heap
    allocator that splits and coalesces blocks.
  tech: [C, x86, Systems]
  note: >-
    Coursework in a private university repository, so the source isn't mine to
    publish — the write-up covers the design.
  year: 2025
  featured: true

- name: Full-Stack Fishing Web Application
  description: >-
    A web app that pulls live marine and fishing conditions from NOAA's public
    API datasets and visualizes them. I built the Node.js backend handling API
    requests, data processing, and routing, and contributed to the front end.
  tech: [Node.js, JavaScript, SQL, REST APIs]
  year: 2024
  featured: false

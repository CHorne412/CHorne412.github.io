{%- comment -%} Apply the saved theme before first paint so there is no flash. {%- endcomment -%}
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

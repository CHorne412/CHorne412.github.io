<header class="site-header">
  <div class="wrap wrap--wide site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"         {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/blog/' | relative_url }}"     {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/about/' | relative_url }}"    {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a>

      <button class="theme-toggle" type="button" id="theme-toggle"
              aria-label="Toggle colour theme" title="Toggle colour theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
